{% extends "base.html" %}
{% block content %}
<section class="page-head">
    <div>
        <h1>搜索{% if query %}：{{ query }}{% endif %}</h1>
        <p class="sub">找到 {{ total }} 条结果{% if current_uid %} · 已按作者筛选{% endif %}</p>
    </div>
    <div class="view-toggle">
        <a class="{% if sort == 'desc' %}active{% endif %}" href="{{ url_for('search', q=query, uid=current_uid, sort='desc', charge=1 if include_charge else 0) }}">最新</a>
        <a class="{% if sort == 'asc' %}active{% endif %}" href="{{ url_for('search', q=query, uid=current_uid, sort='asc', charge=1 if include_charge else 0) }}">最早</a>
    </div>
</section>

<form class="filter-bar" action="{{ url_for('search') }}" method="get">
    <input type="search" name="q" value="{{ query }}" placeholder="输入关键词..." aria-label="搜索关键词">
    <select name="uid" aria-label="筛选作者">
        <option value="">全部作者</option>
        {% for u in users %}
        <option value="{{ u.uid }}" {% if current_uid == u.uid %}selected{% endif %}>{{ u.name }}</option>
        {% endfor %}
    </select>
    <input type="hidden" name="sort" value="{{ sort }}">
    <label class="check"><input type="checkbox" name="charge" value="1" {% if include_charge %}checked{% endif %}> 显示充电占位</label>
    <button class="btn-search" type="submit">筛选</button>
</form>

<div class="feed" id="feed"
     data-next-offset="{{ next_offset }}"
     data-uid="{{ current_uid or '' }}"
     data-query="{{ query }}"
     data-sort="{{ sort }}"
     data-charge="{{ 1 if include_charge else 0 }}">
    <div id="postList">
        {% include "partials/post_list.html" %}
    </div>
    <div class="empty" id="feedEmpty" {% if posts %}hidden{% endif %}>
        <div class="empty-mark">◌</div>
        <p>没有找到匹配的动态</p>
        <p class="sub">换一个关键词，或去 <a href="{{ url_for('index') }}">全部动态</a> 看看</p>
    </div>
    <div class="feed-more" id="feedMore" {% if not has_more %}hidden{% endif %}>
        <button class="btn-more" type="button" id="loadMore">加载更多</button>
    </div>
    <div id="feedSentinel" class="feed-sentinel" aria-hidden="true"></div>
</div>
{% endblock %}
