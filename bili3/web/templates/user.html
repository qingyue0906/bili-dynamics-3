{% extends "base.html" %}
{% block content %}
<section class="profile">
    <span class="avatar profile-avatar" style="--hue: {{ user.uid % 360 }}">
        <img src="{{ url_for('avatar', uid=user.uid, v=user.avatar_updated_at or 0) }}" alt="">
    </span>
    <div class="profile-info">
        <h1>{{ user.name }}</h1>
        <p class="sub">UID {{ user.uid }} · {{ total }} 条图文{% if user.last_sync_at %} · 上次同步 {{ user.last_sync_at|timestamp_time }}{% endif %}</p>
        <div class="profile-links">
            <a href="https://space.bilibili.com/{{ user.uid }}" target="_blank" rel="noopener">B 站空间 ↗</a>
            <a href="{{ url_for('search', uid=user.uid) }}">在本页搜索</a>
        </div>
    </div>
</section>

<div class="feed" id="feed"
     data-next-offset="{{ next_offset }}"
     data-uid="{{ current_uid }}"
     data-query=""
     data-sort="desc"
     data-charge="0">
    <div id="postList">
        {% include "partials/post_list.html" %}
    </div>
    <div class="empty" id="feedEmpty" {% if posts %}hidden{% endif %}>
        <div class="empty-mark">◌</div>
        <p>这个作者还没有可展示的图文</p>
    </div>
    <div class="feed-more" id="feedMore" {% if not has_more %}hidden{% endif %}>
        <button class="btn-more" type="button" id="loadMore">加载更多</button>
    </div>
    <div id="feedSentinel" class="feed-sentinel" aria-hidden="true"></div>
</div>
{% endblock %}
